[package]
name = "AvisaCtl"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31.1"
chrono = "0.4.40"
serde = { version = "1.0.219", features = ["derive"] }
native-dialog = "0.7.0"
# En la version 0.9.0 no existe FileDialog y me niego a perder tiempo buscando
# como es en la nueva versión, ya lo haré en un futuro
tokio = { version = "1.44.1", features = ["full"] }
sha2 = "0.10.8"
ssh2 = "0.9.5"
serde_json = "1.0.140"
regex = "1.11.1"