[package]
name = "AvisaCtl"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31.1"
chrono = "0.4.40"
confy = "0.6.1"
serde = { version = "1.0.219", features = ["derive"] }
native-dialog = "0.7.0"
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
sha2 = "0.10"
serde_json = "1"